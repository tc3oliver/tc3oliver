name: Update OSS contributions

on:
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the diff without committing
        type: boolean
        default: false
  pull_request:
    paths:
      - README.md
      - data/**
      - scripts/**
      - tests/**
      - .github/workflows/update-oss-contributions.yml

permissions:
  contents: read

jobs:
  # Pull requests: run the tests and show the generated diff, read-only.
  # Pull requests from forks are skipped, so no outside code runs here.
  check:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python scripts/update_oss_contributions.py --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: update-oss-contributions
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests

      - name: Regenerate README sections
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/update_oss_contributions.py --dry-run
          else
            python scripts/update_oss_contributions.py
          fi

      - name: Commit if changed
        if: inputs.dry_run != true
        run: |
          if git diff --quiet -- README.md; then
            echo "No change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): update OSS contributions"
          git push
