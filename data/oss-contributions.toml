# Source of truth for the OSS sections of README.md.
#
# scripts/update_oss_contributions.py reads this file, queries GitHub for every
# pull request authored by `author`, and rewrites only the text between the
# OSS-SELECTED and OSS-AUTO markers in README.md.
#
# - `selected` is curated by hand. The script syncs each entry's status, title
#   and URL, and never adds, removes or reorders entries on its own. A PR that was
#   closed without merging is left out of the rendered list with a warning; the
#   entry stays here until you delete it.
# - The generated record lists every public pull request outside the author's
#   own repositories, minus `ignore` and `superseded`.

author = "tc3oliver"

# Display names for the generated record. Repositories listed here get their own
# group, in this order; every other repository is grouped under "Other projects".
projects = [
  { repo = "apple/coremltools", name = "Apple coremltools" },
  { repo = "ml-explore/mlx", name = "MLX" },
  { repo = "jundot/omlx", name = "oMLX" },
]

# Pull requests left out of the record entirely, e.g. low-signal ones.
# Format: "owner/repo#number".
ignore = []

# Pull requests replaced by others. They are not counted and not listed as
# active; the record keeps them in a collapsed note instead.
[[superseded]]
pr = "jundot/omlx#3793"
replaced_by = ["jundot/omlx#3964", "jundot/omlx#3962"]

# Selected OSS Contributions. `summary` states the systems problem the change
# solved. Entries render in this order within their project, merged first.
[[selected]]
project = "Apple coremltools"
prs = ["apple/coremltools#2876"]
summary = "`MLModel.predict()` held the GIL for the whole native Core ML call, so other Python threads in the process stalled behind it. The patch releases it around the native call, with a threading test."

[[selected]]
project = "MLX"
prs = ["ml-explore/mlx#4615"]
summary = "The distributed launcher could lose a rank's final output when the process exited before its pipes were drained. The fix reads both pipes to EOF without blocking."

[[selected]]
project = "oMLX"
prs = ["jundot/omlx#3685"]
summary = "The SDPA256 prefill path was picked by how much memory happened to be free, so the same request could give different temperature-0 output in two processes. Now the choice depends only on the input shape."

[[selected]]
project = "oMLX"
prs = ["jundot/omlx#3840", "jundot/omlx#3842"]
summary = "On hybrid attention/recurrent models the SpecPrefill draft cache never hit: a restored cache looked empty, and recurrent state wasn't saved at block boundaries."

[[selected]]
project = "oMLX"
prs = ["jundot/omlx#3664"]
summary = "The Responses API dropped `namespace` tool groups, which is how Codex passes MCP tools, so the model never saw them."

[[selected]]
project = "oMLX"
prs = ["jundot/omlx#4035"]
summary = "After a failed SpecPrefill request, stale state could hang the engine or make the retry prefill the wrong tokens."

[[selected]]
project = "ROCm AITER"
prs = ["ROCm/aiter#6693"]
summary = "Qwen3.8-Flash-Next FP8 fused MoE had no tuned rows for MI325X (gfx942, 304 CUs) and ran the default configs. The patch adds eight tuned rows: 3.7–13% less fused-MoE time on those shapes in the tuner's compare report. End to end, cold prefill moved +0.8%; decode mostly doesn't hit the new rows."

[[selected]]
project = "vLLM"
prs = ["vllm-project/vllm#62589"]
summary = "The ROCm sparse-attention indexer scored every row against the full page-table width; in a 32K prefill on MI325X that kernel took 43% of GPU time. The patch skips columns past each request's visible range and tiles the scoring. An independent tester measured 1.61× geometric-mean output throughput over 12 cases on MI355X, on the first revision."
